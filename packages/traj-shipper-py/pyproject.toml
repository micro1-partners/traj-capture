[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traj-shipper"
version = "0.1.0"
description = "Land production-agent runs in micro1 trajectory storage. Fail-open, background upload, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "micro1", email = "shanie@micro1.ai" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["traj_shipper*"]
